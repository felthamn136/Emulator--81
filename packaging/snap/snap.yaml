name: membrane81
version: '0.1.0'
summary: Sinclair ZX81 emulator
description: |
  Membrane81 is a Rust and Macroquad ZX81 emulator with a CRT-style display,
  a games library, and support for ZX81 .P program files.
base: core26
architectures:
  - amd64
confinement: strict
grade: stable
apps:
  membrane81:
    command: bin/membrane81
    desktop: meta/gui/membrane81.desktop
    plugs:
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - opengl
      - audio-playback
      - home
      - gpu-2604
plugs:
  gpu-2604:
    interface: content
    target: $SNAP/gpu-2604
    default-provider: mesa-2604
