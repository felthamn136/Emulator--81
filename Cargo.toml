[package]
name = "zx81_emulator"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4.14"
cpal = "0.15"
display-info = "0.5.10"
dirs = "7"
hound = "3.5"
image = { version = "0.24", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
z80 = { path = "vendor/z80" }

[dev-dependencies]
serde_json = "1"

[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
